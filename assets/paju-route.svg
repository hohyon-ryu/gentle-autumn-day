<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 800" role="img" aria-labelledby="t d"><title id="t">임진각 주요 편의시설 위치 개략도</title><desc id="d">공개 관광정보 좌표를 바탕으로 새로 그린 위치도. A 곤돌라 앞 주차 지점, B 화장실, C 평화누리 입구, D 연못 데크, E 지원센터 화장실, F 평화랜드. 실제 도보 경로가 아님.</desc><rect width="920" height="800" fill="#e7ebde"/><g font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif" fill="#253d33"><text x="35" y="42" font-size="23" font-weight="700">어디가 어디인지, 먼저 보기</text><text x="35" y="73" font-size="14">공개 관광정보 좌표 기반 · 길/출입구/현장 통제는 표시하지 않음</text><path d="M848 118 V65 M836 82 L848 64 L860 82" fill="none" stroke="#253d33" stroke-width="3"/><text x="840" y="140" font-size="20">북</text><circle cx="241.6" cy="489.5" r="22" fill="#244c3e"/><text x="241.6" y="496.5" font-size="20" fill="white" text-anchor="middle" font-weight="700">A</text><text x="274.6" y="496.5" font-size="20" font-weight="700">주차·하차 출발점</text><circle cx="265.0" cy="417.4" r="22" fill="#244c3e"/><text x="265.0" y="424.4" font-size="20" fill="white" text-anchor="middle" font-weight="700">B</text><text x="298.0" y="424.4" font-size="20" font-weight="700">곤돌라 쪽 화장실</text><circle cx="561.3" cy="370.6" r="22" fill="#244c3e"/><text x="561.3" y="377.6" font-size="20" fill="white" text-anchor="middle" font-weight="700">C</text><text x="594.3" y="377.6" font-size="20" font-weight="700">평화누리 입구</text><circle cx="546.3" cy="240.2" r="22" fill="#244c3e"/><text x="546.3" y="247.2" font-size="20" fill="white" text-anchor="middle" font-weight="700">D</text><text x="579.3" y="247.2" font-size="20" font-weight="700">연못 쪽 데크</text><circle cx="637.4" cy="135.5" r="22" fill="#244c3e"/><text x="637.4" y="142.5" font-size="20" fill="white" text-anchor="middle" font-weight="700">E</text><text x="670.4" y="142.5" font-size="20" font-weight="700">지원센터 화장실</text><circle cx="450.1" cy="644.0" r="22" fill="#244c3e"/><text x="450.1" y="651.0" font-size="20" fill="white" text-anchor="middle" font-weight="700">F</text><text x="483.1" y="651.0" font-size="20" font-weight="700">평화랜드</text><rect x="30" y="685" width="860" height="90" fill="#f5f2ea"/><text x="50" y="718" font-size="17">A → C : 관광공사 조사상 약 260m · 모든 주차면 기준이 아닙니다.</text><text x="50" y="748" font-size="16">자료에 2022년 현장 정보 포함. 길 찾기는 현장 안내도와 직원 안내를 따르세요.</text></g></svg>